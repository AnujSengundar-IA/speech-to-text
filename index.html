<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Whisper Streaming Demo</title>
    <style>
        :root {
            --bg: #f4efe7;
            --bg-soft: #e9dfcf;
            --panel: #fffaf2;
            --ink: #1f2a2e;
            --ink-soft: #526066;
            --line: #d4c6b2;
            --accent: #d55b2d;
            --accent-strong: #b8461f;
            --ok: #2f7d4c;
            --warn: #ab7b00;
            --error: #a12a2a;
            --shadow: 0 14px 30px rgba(40, 30, 20, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Space Grotesk", "Avenir Next", "Segoe UI", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 8% 12%, #f9d4b7 0%, transparent 32%),
                radial-gradient(circle at 92% 6%, #f4c2a6 0%, transparent 28%),
                linear-gradient(165deg, var(--bg) 0%, var(--bg-soft) 100%);
            min-height: 100vh;
            padding: 24px;
        }

        .app {
            max-width: 980px;
            margin: 0 auto;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 22px;
            box-shadow: var(--shadow);
            overflow: hidden;
            animation: rise-in 360ms ease-out;
        }

        .hero {
            padding: 22px 24px 18px;
            border-bottom: 1px solid var(--line);
            background:
                linear-gradient(115deg, rgba(213, 91, 45, 0.1), rgba(213, 91, 45, 0));
        }

        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.25rem, 2.4vw, 1.9rem);
            line-height: 1.2;
            letter-spacing: 0.01em;
        }

        .subtitle {
            margin: 8px 0 0;
            color: var(--ink-soft);
            font-size: 0.95rem;
        }

        .status-pill {
            font-family: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace;
            font-size: 0.8rem;
            padding: 7px 12px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: #f8f1e8;
            color: var(--ink-soft);
            white-space: nowrap;
        }

        .status-pill.recording {
            border-color: #bfe1ca;
            color: var(--ok);
            background: #edf8f1;
        }

        .status-pill.error {
            border-color: #efcccc;
            color: var(--error);
            background: #fdeeee;
        }

        .controls {
            padding: 16px 24px;
            border-bottom: 1px solid var(--line);
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .controls label {
            font-weight: 700;
            font-size: 0.86rem;
            color: var(--ink-soft);
        }

        .controls select {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 0.9rem;
            background: #fff;
            color: var(--ink);
        }

        button {
            border: 0;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.92rem;
            padding: 10px 15px;
            cursor: pointer;
            transition: transform 120ms ease, opacity 120ms ease, background-color 120ms ease;
        }

        button:active {
            transform: translateY(1px);
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        #startBtn {
            background: var(--accent);
            color: #fff;
        }

        #startBtn:hover:not(:disabled) {
            background: var(--accent-strong);
        }

        #stopBtn {
            background: #23292b;
            color: #fefefe;
        }

        #clearBtn {
            background: transparent;
            color: var(--ink-soft);
            border: 1px solid var(--line);
        }

        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 14px;
            padding: 18px;
        }

        .panel {
            border: 1px solid var(--line);
            border-radius: 14px;
            background: #fffdf9;
            overflow: hidden;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            animation: fade-up 380ms ease both;
        }

        .panel:nth-of-type(2) {
            animation-delay: 80ms;
        }

        .panel h2 {
            margin: 0;
            font-size: 0.9rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--ink-soft);
            font-weight: 700;
            padding: 12px 14px;
            border-bottom: 1px solid var(--line);
            background: #f7efe4;
        }

        .transcript {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            overflow: auto;
        }

        .transcript-paragraph {
            margin: 0;
            line-height: 1.6;
            word-break: break-word;
            color: #22353d;
        }

        .transcript-final {
            color: #22353d;
        }

        .transcript-partial {
            color: #6a4a31;
            font-style: italic;
        }

        .log {
            padding: 12px;
            margin: 0;
            list-style: none;
            overflow: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-family: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace;
            font-size: 0.76rem;
            color: #4d5a5f;
        }

        .log li {
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 8px 9px;
            background: #fcf6ed;
        }

        .tag-status {
            color: var(--ok);
            font-weight: 700;
        }

        .tag-error {
            color: var(--error);
            font-weight: 700;
        }

        @media (max-width: 820px) {
            body {
                padding: 14px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .controls {
                padding: 12px;
            }
        }

        @keyframes rise-in {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fade-up {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <header class="hero">
            <div class="title-row">
                <h1>Whisper Streaming Console</h1>
                <div id="statusPill" class="status-pill">Idle</div>
            </div>
            <p class="subtitle">Real-time speech-to-text with partial and final transcript segments.</p>
        </header>

        <section class="controls">
            <label for="modelSelect">Model</label>
            <select id="modelSelect">
                <option value="whisper">Whisper (small.en)</option>
                <option value="parakeet">Parakeet (ctc-0.6b)</option>
                <option value="indicconformer">IndicConformer (NeMo)</option>
            </select>
            <label for="languageSelect">Language</label>
            <select id="languageSelect">
                <option value="as">Assamese (as)</option>
                <option value="bn">Bengali (bn)</option>
                <option value="brx">Bodo (brx)</option>
                <option value="doi">Dogri (doi)</option>
                <option value="gu">Gujarati (gu)</option>
                <option value="hi" selected>Hindi (hi)</option>
                <option value="kn">Kannada (kn)</option>
                <option value="ks">Kashmiri (ks)</option>
                <option value="kok">Konkani (kok)</option>
                <option value="mai">Maithili (mai)</option>
                <option value="ml">Malayalam (ml)</option>
                <option value="mni">Manipuri (mni)</option>
                <option value="mr">Marathi (mr)</option>
                <option value="ne">Nepali (ne)</option>
                <option value="or">Odia (or)</option>
                <option value="pa">Punjabi (pa)</option>
                <option value="sa">Sanskrit (sa)</option>
                <option value="sat">Santali (sat)</option>
                <option value="sd">Sindhi (sd)</option>
                <option value="ta">Tamil (ta)</option>
                <option value="te">Telugu (te)</option>
                <option value="ur">Urdu (ur)</option>
            </select>
            <button id="startBtn" onclick="start()">Start</button>
            <button id="stopBtn" onclick="stop()" disabled>Stop</button>
            <button id="clearBtn" onclick="clearTranscript()">Clear</button>
        </section>

        <section class="grid">
            <article class="panel">
                <h2>Transcript</h2>
                <div id="transcript" class="transcript"></div>
            </article>
            <article class="panel">
                <h2>Session Log</h2>
                <ul id="logList" class="log"></ul>
            </article>
        </section>
    </main>

    <script>
        let audioContext;
        let processor;
        let source;
        let mediaStream;
        let ws;
        let isRecording = false;
        let isStarting = false;
        let partialText = "";
        let lastPartialWindowStartSec = null;
        let finalTranscript = "";
        const wsMessageDecoder = typeof TextDecoder !== "undefined" ? new TextDecoder() : null;

        function setButtons() {
            const startBtn = document.getElementById("startBtn");
            const stopBtn = document.getElementById("stopBtn");
            const modelSelect = document.getElementById("modelSelect");
            const languageSelect = document.getElementById("languageSelect");
            startBtn.disabled = isRecording || isStarting;
            stopBtn.disabled = !isRecording && !isStarting;
            modelSelect.disabled = isRecording || isStarting;
            languageSelect.disabled = isRecording || isStarting || modelSelect.value !== "indicconformer";
        }

        function updateLanguageSelectState() {
            const modelSelect = document.getElementById("modelSelect");
            const languageSelect = document.getElementById("languageSelect");
            languageSelect.disabled = isRecording || isStarting || modelSelect.value !== "indicconformer";
        }

        function setStatus(text, kind = "idle") {
            const pill = document.getElementById("statusPill");
            pill.textContent = text;
            pill.classList.remove("recording", "error");
            if (kind === "recording") pill.classList.add("recording");
            if (kind === "error") pill.classList.add("error");
        }

        function renderTranscript() {
            const container = document.getElementById("transcript");
            container.innerHTML = "";
            const paragraph = document.createElement("p");
            paragraph.className = "transcript-paragraph";

            const finalSpan = document.createElement("span");
            finalSpan.className = "transcript-final";
            finalSpan.textContent = finalTranscript;
            paragraph.appendChild(finalSpan);

            if (partialText) {
                const partialSpan = document.createElement("span");
                partialSpan.className = "transcript-partial";
                partialSpan.textContent = `${finalTranscript ? " " : ""}${partialText}`;
                paragraph.appendChild(partialSpan);
            }

            container.appendChild(paragraph);

            container.scrollTop = container.scrollHeight;
        }

        function appendLog(message, type = "info") {
            const logList = document.getElementById("logList");
            const li = document.createElement("li");
            const stamp = new Date().toLocaleTimeString();
            if (type === "status") {
                li.innerHTML = `<span class="tag-status">STATUS</span> ${stamp} ${message}`;
            } else if (type === "error") {
                li.innerHTML = `<span class="tag-error">ERROR</span> ${stamp} ${message}`;
            } else {
                li.textContent = `${stamp} ${message}`;
            }
            logList.appendChild(li);
            logList.scrollTop = logList.scrollHeight;
        }

        function formatMeta(data) {
            const parts = [];
            if (data.status) parts.push(`status=${data.status}`);
            if (data.reason) parts.push(`reason=${data.reason}`);
            if (data.message) parts.push(`message=${data.message}`);
            if (typeof data.end === "number") parts.push(`end=${data.end.toFixed(2)}s`);
            return parts.length ? `(${parts.join(", ")})` : "";
        }

        function normalizeSpaces(text) {
            return text.replace(/\s+/g, " ").trim();
        }

        function mergeSlidingPartial(previousText, incomingText) {
            const prev = normalizeSpaces(previousText);
            const incoming = normalizeSpaces(incomingText);
            if (!prev) return incoming;
            if (!incoming) return prev;

            if (incoming.toLowerCase().startsWith(prev.toLowerCase())) {
                return incoming;
            }
            if (prev.toLowerCase().endsWith(incoming.toLowerCase())) {
                return prev;
            }

            const prevWords = prev.split(" ");
            const incomingWords = incoming.split(" ");
            const maxOverlap = Math.min(prevWords.length, incomingWords.length);
            let overlap = 0;

            for (let k = maxOverlap; k > 0; k--) {
                const prevSuffix = prevWords.slice(-k).join(" ").toLowerCase();
                const incomingPrefix = incomingWords.slice(0, k).join(" ").toLowerCase();
                if (prevSuffix === incomingPrefix) {
                    overlap = k;
                    break;
                }
            }

            if (overlap > 0) {
                return `${prev} ${incomingWords.slice(overlap).join(" ")}`.trim();
            }

            return incoming;
        }

        function handleServerMessage(rawData) {
            let data;
            try {
                data = JSON.parse(rawData);
            } catch {
                appendLog(`[unstructured] ${rawData}`);
                return;
            }

            if (!data || typeof data !== "object") {
                appendLog("Ignored non-object message");
                return;
            }

            switch (data.type) {
                case "partial":
                    if (typeof data.text === "string") {
                        const incoming = normalizeSpaces(data.text);
                        const windowStart = typeof data.window_start_sec === "number"
                            ? data.window_start_sec
                            : null;

                        if (
                            windowStart !== null
                            && lastPartialWindowStartSec !== null
                            && windowStart < lastPartialWindowStartSec
                        ) {
                            partialText = incoming;
                        } else {
                            partialText = mergeSlidingPartial(partialText, incoming);
                        }
                        lastPartialWindowStartSec = windowStart;
                    }
                    renderTranscript();
                    break;
                case "final":
                    if (typeof data.text === "string" && data.text.trim()) {
                        const incoming = normalizeSpaces(data.text);
                        finalTranscript = normalizeSpaces(`${finalTranscript} ${incoming}`);
                    }
                    partialText = "";
                    lastPartialWindowStartSec = null;
                    renderTranscript();
                    break;
                case "status":
                    appendLog(formatMeta(data), "status");
                    if (data.status === "connected") setStatus("Connected", "recording");
                    if (data.status === "busy") setStatus("Busy", "recording");
                    if (data.status === "pong") setStatus("Live", "recording");
                    break;
                case "error":
                    appendLog(formatMeta(data), "error");
                    setStatus("Error", "error");
                    break;
                default:
                    appendLog(`[message:${data.type || "unknown"}] ${JSON.stringify(data)}`);
            }
        }

        function decodeBinaryPayload(buffer) {
            if (!(buffer instanceof ArrayBuffer)) return "";
            if (wsMessageDecoder) {
                return wsMessageDecoder.decode(buffer);
            }
            return String.fromCharCode(...new Uint8Array(buffer));
        }

        function connectWebSocket(url) {
            return new Promise((resolve, reject) => {
                let settled = false;
                try {
                    ws = new WebSocket(url);
                } catch (err) {
                    reject(err);
                    return;
                }

                ws.binaryType = "arraybuffer";

                ws.onopen = () => {
                    appendLog("websocket open", "status");
                    setStatus("Connected", "recording");
                    if (!settled) {
                        settled = true;
                        resolve();
                    }
                };

                ws.onmessage = async (event) => {
                    let payload = event.data;
                    if (payload instanceof ArrayBuffer) {
                        payload = decodeBinaryPayload(payload);
                    } else if (payload instanceof Blob) {
                        payload = await payload.text();
                    } else if (typeof payload !== "string") {
                        payload = String(payload);
                    }
                    handleServerMessage(payload);
                };

                ws.onerror = () => {
                    appendLog("websocket runtime error", "error");
                    setStatus("Error", "error");
                    if (!settled) {
                        settled = true;
                        reject(new Error("websocket connection failed"));
                    }
                };

                ws.onclose = async () => {
                    appendLog("websocket closed", "status");
                    const shouldTearDownAudio = isRecording || isStarting;
                    ws = null;
                    if (!settled) {
                        settled = true;
                        reject(new Error("websocket closed before opening"));
                        return;
                    }
                    if (shouldTearDownAudio) {
                        await cleanupAudio();
                        isRecording = false;
                        isStarting = false;
                        setButtons();
                        if (document.getElementById("statusPill").textContent !== "Error") {
                            setStatus("Idle");
                        }
                    }
                };
            });
        }

        function closeWebSocket(sendStop = false) {
            if (!ws) return;
            const socket = ws;
            ws = null;
            if (sendStop && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ event: "stop" }));
            }
            socket.onopen = null;
            socket.onmessage = null;
            socket.onerror = null;
            socket.onclose = null;
            if (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING) {
                socket.close();
            }
        }

        async function cleanupAudio() {
            if (processor) {
                if (processor.port) {
                    processor.port.onmessage = null;
                }
                processor.disconnect();
                if (processor.onaudioprocess) {
                    processor.onaudioprocess = null;
                }
                processor = null;
            }
            if (source) {
                source.disconnect();
                source = null;
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
                mediaStream = null;
            }
            if (audioContext) {
                try {
                    await audioContext.close();
                } catch (err) {
                    console.warn("Failed to close AudioContext:", err);
                }
                audioContext = null;
            }
        }

        function clearTranscript() {
            partialText = "";
            lastPartialWindowStartSec = null;
            finalTranscript = "";
            document.getElementById("logList").innerHTML = "";
            renderTranscript();
            setStatus("Idle");
        }

        async function start() {
            if (isRecording || isStarting) return;
            isStarting = true;
            setButtons();
            clearTranscript();
            setStatus("Connecting...");

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new AudioContext({ sampleRate: 16000 });
                console.log("Sample rate:", audioContext.sampleRate);

                source = audioContext.createMediaStreamSource(mediaStream);
                await audioContext.audioWorklet.addModule("pcm-worklet.js");
                const workletNode = new AudioWorkletNode(audioContext, "pcm-processor");

                source.connect(workletNode);
                workletNode.connect(audioContext.destination);

                workletNode.port.onmessage = (event) => {
                    const message = event.data;
                    if (!message || typeof message !== "object") return;
                    if (message.type === "pcm_chunk") {
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(message.payload);
                        }
                    }
                };
                processor = workletNode;
                const model = document.getElementById("modelSelect").value;
                const endpointMap = {
                    whisper: "ws://127.0.0.1:8999/ws/transcribe",
                    parakeet: "ws://127.0.0.1:8999/ws/transcribe/parakeet",
                    indicconformer: "ws://127.0.0.1:8999/ws/transcribe/indicconformer",
                };
                let endpoint = endpointMap[model] || endpointMap.whisper;
                if (model === "indicconformer") {
                    const languageId = document.getElementById("languageSelect").value || "hi";
                    endpoint += `?language_id=${encodeURIComponent(languageId)}`;
                }
                await connectWebSocket(endpoint);

                isRecording = true;
                isStarting = false;
                setButtons();
                setStatus("Recording", "recording");
                appendLog("Microphone capture started", "status");
            } catch (err) {
                appendLog(`Start failed: ${err.message || err}`, "error");
                closeWebSocket(false);
                await cleanupAudio();
                isRecording = false;
                isStarting = false;
                setButtons();
                setStatus("Error", "error");
            }
        }

        async function stop() {
            closeWebSocket(true);

            await cleanupAudio();
            isRecording = false;
            isStarting = false;
            setButtons();
            setStatus("Idle");
            appendLog("Stopped by user", "status");
        }

        setButtons();
        document.getElementById("modelSelect").addEventListener("change", () => {
            updateLanguageSelectState();
            setButtons();
        });
        updateLanguageSelectState();
        setStatus("Idle");
    </script>
</body>

</html>
